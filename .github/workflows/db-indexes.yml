name: DB indexes migration
on:
  push:
    branches: ['claude/family-hub-pwa-build-j1eivv']
    paths: ['.github/db-indexes.trigger']
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply index migration
        env:
          RAW_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$RAW_DB_URL" ]; then echo "::error::SUPABASE_DB_URL secret is not set."; exit 1; fi
          DB_URL=$(printf '%s' "$RAW_DB_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrate_indexes.sql
          N=$(psql "$DB_URL" -tA -c "select count(*) from pg_indexes where schemaname='public' and indexname in ('expenses_family_spent_idx','accommodations_family_start_idx','conversation_members_member_idx','document_versions_document_idx','message_reactions_message_idx','funding_sources_family_idx');")
          if [ "$N" != "6" ]; then echo "::error::expected 6 indexes, found $N."; exit 1; fi
          echo "all 6 indexes present."
