name: DB apply
on:
  push:
    branches: ['claude/family-hub-pwa-build-j1eivv']
    paths: ['.github/db-apply.trigger']
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Connectivity check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::SUPABASE_DB_URL secret is not set."; exit 1; fi
          HOST=$(echo "$DB_URL" | sed -E 's#.*@([^:/]+).*#\1#')
          USERPART=$(echo "$DB_URL" | sed -E 's#postgresql://([^:]+):.*#\1#')
          echo "Host: $HOST"
          echo "User: $USERPART"
          echo "::notice::Connecting to host=$HOST user=$USERPART"
          set +e
          OUT=$(psql "$DB_URL" -c "select 1 as ok" 2>&1)
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            MSG=$(echo "$OUT" | grep -iE 'psql:|error|fatal|could not|authentication|host|timeout' | head -2 | tr '\n' ' ')
            echo "::error::Cannot connect (exit $CODE) to host=$HOST — $MSG"
            exit 1
          fi
          echo "::notice::Connection OK"
      - name: Apply schema, RLS, reference data, seed
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/reset_and_setup.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          echo "::notice::$(psql "$DB_URL" -tA -c "select 'tables='||count(*)||' policies='||(select count(*) from pg_policies where schemaname='public')||' members='||(select count(*) from public.family_members) from information_schema.tables where table_schema='public' limit 1;")"
