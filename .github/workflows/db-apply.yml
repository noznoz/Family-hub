name: DB apply
on:
  push:
    branches: ['claude/family-hub-pwa-build-j1eivv']
    paths: ['.github/db-apply.trigger']
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply everything
        env:
          RAW_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$RAW_DB_URL" ]; then echo "::error::SUPABASE_DB_URL secret is not set."; exit 1; fi
          # Trim CR/LF and surrounding whitespace that a paste can introduce.
          DB_URL=$(printf '%s' "$RAW_DB_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          HOST=$(printf '%s' "$DB_URL" | sed -E 's#.*@([^:/]+).*#\1#')
          echo "::notice::host=$HOST db-tail=$(printf '%s' "$DB_URL" | sed -E 's#.*/##')"
          set +e
          OUT=$(psql "$DB_URL" -c "select 1" 2>&1); CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "::error::connect failed (exit $CODE): $(printf '%s' "$OUT" | grep -iE 'fatal|error|could not|auth' | head -1)"
            exit 1
          fi
          echo "Connected. Applying schema + seed…"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/reset_and_setup.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          SUMMARY=$(psql "$DB_URL" -tA -c "select 'tables='||(select count(*) from information_schema.tables where table_schema='public')||' policies='||(select count(*) from pg_policies where schemaname='public')||' members='||(select count(*) from public.family_members)||' students='||(select count(*) from public.student_profiles);")
          echo "::notice::DONE $SUMMARY"
