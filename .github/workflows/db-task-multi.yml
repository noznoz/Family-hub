name: DB task multi migration
on:
  push:
    branches: ['claude/family-hub-pwa-build-j1eivv']
    paths: ['.github/db-task-multi.trigger']
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply task multi migration
        env:
          RAW_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$RAW_DB_URL" ]; then echo "::error::SUPABASE_DB_URL secret is not set."; exit 1; fi
          DB_URL=$(printf '%s' "$RAW_DB_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrate_task_multi.sql
          A=$(psql "$DB_URL" -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_name='task_assignees';")
          S=$(psql "$DB_URL" -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_name='task_students';")
          if [ "$A" != "1" ] || [ "$S" != "1" ]; then echo "::error::task join tables missing (A=$A S=$S)."; exit 1; fi
          echo "task_assignees and task_students present."
