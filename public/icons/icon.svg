<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Family Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14345A"/>
      <stop offset="1" stop-color="#0F2A4A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Home roof + body -->
  <path d="M256 150 L156 232 V360 a16 16 0 0 0 16 16 H340 a16 16 0 0 0 16-16 V232 Z"
